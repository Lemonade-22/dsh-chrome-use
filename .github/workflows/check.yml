name: Build DSH plugin and Chrome extension
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:client
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:client
      - run: npm run package
      - run: npm pack --pack-destination dist
      - name: Describe downloadable packages
        shell: bash
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          {
            echo "## dsh-chrome-use $VERSION"
            echo ""
            echo "Download the artifacts below:"
            echo "- **dsh-plugin-$VERSION**: DSH plugin npm package (.tgz)."
            echo "- **chrome-extension-$VERSION**: Chrome extension (.zip) and SHA-256 checksum."
            echo ""
            echo "Unzip the Chrome extension into a permanent folder, then load that folder at chrome://extensions with Developer mode enabled."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Upload DSH plugin
        uses: actions/upload-artifact@v4
        with:
          name: dsh-plugin-${{ env.PACKAGE_VERSION }}
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 30
      - name: Upload Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-${{ env.PACKAGE_VERSION }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
